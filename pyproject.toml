[project]
name = "rmsync"
version = "0.1.0"
description = "Sync reMarkable notebooks from the cloud and render them to PDF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "rmc~=0.3.0",
    "cairosvg~=2.7",
    "pypdf~=5.1",
]

[project.scripts]
rmsync = "rmsync.cli:main"

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pypdfium2~=4.30",
    "ruff~=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmsync"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
